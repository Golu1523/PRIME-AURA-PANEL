<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BALAMODSXYZ - License Activation Portal</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #080304;
      --card-bg: rgba(18, 9, 12, 0.75);
      --card-border: rgba(239, 68, 68, 0.15);
      --accent-red: #ef4444;
      --accent-crimson: #dc2626;
      --accent-darkred: #991b1b;
      --accent-glow: rgba(239, 68, 68, 0.25);
      --text-main: #ffffff;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --success-glow: rgba(34, 197, 94, 0.2);
      --error: #f87171;
      --error-glow: rgba(239, 68, 68, 0.25);
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
      padding: 16px;
    }

    /* Ambient Crimson Red Background Glows */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      opacity: 0.4;
      pointer-events: none;
      animation: floatOrb 10s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, var(--accent-red), var(--accent-darkred));
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
    }

    .orb-2 {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, #b91c1c, #450a0a);
      bottom: -40px;
      right: -40px;
      animation-delay: -5s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(20px, 20px) scale(1.08); }
    }

    /* Outer Wrapper for Perfect Mobile Centering */
    .portal-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    /* Status Bar */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(18, 9, 12, 0.85);
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #fca5a5;
      margin-bottom: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-red);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-red);
      animation: pulseDot 1.6s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.5; }
    }

    /* Glass Card */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 32px 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6),
                  0 0 25px rgba(239, 68, 68, 0.08) inset;
      transition: all 0.3s ease;
    }

    .glass-card:hover {
      border-color: rgba(239, 68, 68, 0.35);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7),
                  0 0 30px rgba(239, 68, 68, 0.15);
    }

    /* Brand Logo & Title */
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-container {
      width: 76px;
      height: 76px;
      margin: 0 auto 14px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 18px;
      filter: drop-shadow(0 6px 16px rgba(239, 68, 68, 0.4));
      transition: transform 0.3s ease;
    }

    .logo-img:hover {
      transform: scale(1.05);
    }

    .brand-header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #ffffff;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .brand-header p {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 400;
    }

    /* Form & Input */
    .input-wrapper {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .input-label-row label {
      font-size: 11.5px;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .paste-btn {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .paste-btn:hover {
      background: rgba(239, 68, 68, 0.25);
      color: #ffffff;
    }

    .input-relative {
      position: relative;
    }

    .glow-input {
      width: 100%;
      padding: 14px 40px 14px 14px;
      background: rgba(10, 4, 6, 0.85);
      border: 1.5px solid #37171e;
      border-radius: var(--radius-md);
      color: #f87171;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14.5px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 1.5px;
      outline: none;
      text-transform: uppercase;
      transition: all 0.25s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3) inset;
    }

    .glow-input:focus {
      border-color: var(--accent-red);
      background: rgba(18, 7, 10, 0.95);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2),
                  0 4px 10px rgba(0, 0, 0, 0.4) inset;
      color: #fca5a5;
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #cbd5e1;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: rgba(239, 68, 68, 0.4);
      color: #ffffff;
    }

    /* Error / Success Banner */
    #msg {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.25s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glow-error {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .glow-success {
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    /* Red Accent Action Button */
    .btn-action {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-action:hover:not(:disabled) {
      background: linear-gradient(135deg, #f87171, #dc2626);
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
      transform: translateY(-1px);
    }

    .btn-action:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-action:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Success Screen */
    .result-card {
      text-align: center;
      padding: 8px 0;
      animation: zoomIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.94); }
      to { opacity: 1; transform: scale(1); }
    }

    .success-icon-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: rgba(34, 197, 94, 0.12);
      border: 2px solid var(--success);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      color: var(--success);
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.25);
    }

    .result-card h3 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .result-card p {
      font-size: 13.5px;
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    .ip-lock-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      padding: 11px 20px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Footer */
    .portal-footer {
      text-align: center;
      margin-top: 20px;
    }

    .portal-footer a {
      font-size: 12.5px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .portal-footer a:hover {
      color: #fca5a5;
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      .glass-card {
        padding: 24px 18px;
        border-radius: 18px;
      }
      .brand-header h1 {
        font-size: 20px;
      }
      .logo-container {
        width: 68px;
        height: 68px;
      }
      .glow-input {
        font-size: 13.5px;
        padding: 12.5px 36px 12.5px 12.5px;
      }
      .btn-action {
        height: 44px;
        font-size: 13.5px;
      }
    }
  </style>
</head>
<body>

  <!-- Red Ambient Glows -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="portal-wrapper">
    
    <!-- Status Indicator -->
    <div style="text-align: center;">
      <div class="status-badge">
        <div class="pulse-dot"></div>
        <span>SYSTEM ONLINE</span>
      </div>
    </div>

    <!-- Main Card -->
    <div class="glass-card">
      
      <!-- Brand Logo & Title -->
      <div class="brand-header">
        <div class="logo-container">
          <img 
            src="https://raw.githubusercontent.com/Golu1523/Prime-Aura/main/images/logo.png" 
            alt="BALAMODS Logo" 
            class="logo-img"
            onerror="this.onerror=null; this.src='https://github.com/Golu1523/Prime-Aura/raw/main/images/logo.png';">
        </div>
        <h1>BALAMODSXYZ</h1>
        <p>Activate your license key</p>
      </div>

      <!-- Activation Form -->
      <div id="activateForm">
        <div class="input-wrapper">
          <div class="input-label-row">
            <label for="keyInput">License Key</label>
            <button class="paste-btn" onclick="pasteKey()" type="button">📋 Paste</button>
          </div>
          <div class="input-relative">
            <input 
              type="text" 
              id="keyInput" 
              placeholder="BALA-XXXX-XXXX-XXXX" 
              autocomplete="off" 
              spellcheck="false"
              class="glow-input"
              oninput="handleInput(this)">
            <button class="clear-btn" id="clearBtn" onclick="clearKey()" type="button">✕</button>
          </div>
        </div>

        <div id="msg"></div>

        <button class="btn-action" id="activateBtn" onclick="activateKey()" type="button">
          Activate
        </button>
      </div>

      <!-- Result Screen -->
      <div id="resultBox" style="display: none;">
        <div class="result-card">
          <div class="success-icon-badge">✓</div>
          <h3>Activated</h3>
          <p id="successMsg">Your IP is locked. Open the game!</p>

          <div class="ip-lock-pill">
            <span>🔒</span>
            <span>IP Locked</span>
          </div>

          <div>
            <button class="btn-secondary" onclick="resetForm()" type="button">Activate Another Key</button>
          </div>
        </div>
      </div>

      <!-- Footer Link -->
      <div class="portal-footer">
        <a href="http://45.196.196.121/balamods/login.php" target="_blank">
          Admin / Reseller Login
        </a>
      </div>

    </div>
  </div>

  <script>
    const keyInput = document.getElementById('keyInput');
    const clearBtn = document.getElementById('clearBtn');

    function handleInput(input) {
      input.value = input.value.toUpperCase();
      clearBtn.style.display = input.value.trim() ? 'flex' : 'none';
    }

    function clearKey() {
      keyInput.value = '';
      clearBtn.style.display = 'none';
      keyInput.focus();
    }

    async function pasteKey() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          keyInput.value = text.trim().toUpperCase();
          clearBtn.style.display = 'flex';
          keyInput.focus();
        }
      } catch (err) {
        console.log('Clipboard unavailable');
      }
    }

    async function activateKey() {
      const key = keyInput.value.trim().toUpperCase();
      const msg = document.getElementById('msg');
      const btn = document.getElementById('activateBtn');
      const form = document.getElementById('activateForm');
      const result = document.getElementById('resultBox');
      const successMsg = document.getElementById('successMsg');

      if (!key) {
        showMsg(msg, 'Enter your license key', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Activating...';

      try {
        const r = await fetch('/api/user_activate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: key })
        });

        const d = await r.json();

        if (d.status === 'ok') {
          form.style.display = 'none';
          result.style.display = 'block';
          successMsg.textContent = d.message || 'Your IP is locked. Open the game!';
        } else {
          showMsg(msg, d.message || 'Failed', 'error');
          btn.disabled = false;
          btn.textContent = 'Activate';
        }
      } catch (err) {
        showMsg(msg, 'Connection failed', 'error');
        btn.disabled = false;
        btn.textContent = 'Activate';
      }
    }

    function resetForm() {
      document.getElementById('activateForm').style.display = 'block';
      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('msg').style.display = 'none';
      const btn = document.getElementById('activateBtn');
      btn.disabled = false;
      btn.textContent = 'Activate';
      clearKey();
    }

    function showMsg(el, text, type) {
      el.className = type === 'error' ? 'glow-error' : 'glow-success';
      el.style.display = 'flex';
      el.innerHTML = (type === 'error' ? '⚠️ ' : '✓ ') + text;
    }

    keyInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        activateKey();
      }
    });
  </script>
</body>
</html>
