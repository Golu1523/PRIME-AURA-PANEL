<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prime Aura - License Activation Portal</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #080304;
      --card-bg: rgba(18, 9, 12, 0.78);
      --card-border: rgba(255, 0, 0, 0.2);
      --accent-red: #ff0000;
      --text-main: #ffffff;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
      padding: 16px;
    }

    /* Ambient Crimson Red Background Glows */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      opacity: 0.4;
      pointer-events: none;
      animation: floatOrb 10s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #ff0000, #991b1b);
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
    }

    .orb-2 {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, #b91c1c, #450a0a);
      bottom: -40px;
      right: -40px;
      animation-delay: -5s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(20px, 20px) scale(1.08); }
    }

    /* Outer Wrapper for Mobile Centering */
    .portal-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    /* Status Bar Badge in Footer (Red Border & Text) */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(18, 9, 12, 0.85);
      border: 1px solid rgba(255, 0, 0, 0.3);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #ff4d4d;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    /* Only Dot is Green */
    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      animation: pulseDot 1.6s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.5; }
    }

    /* Glass Card */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 32px 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6),
                  0 0 25px rgba(255, 0, 0, 0.08) inset;
    }

    /* Brand Logo & Title */
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-container {
      width: 96px;
      height: 96px;
      margin: 0 auto 14px;
      position: relative;
      border-radius: 50%;
      overflow: hidden;
      border: 2.5px solid rgba(255, 0, 0, 0.6);
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080304;
      padding: 4px;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: 65% 50%;
      border-radius: 50%;
      transform: scale(1.22) translateX(3px);
    }

    .brand-header h1 {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .text-red {
      color: #ff0000 !important;
      text-shadow: 0 0 14px rgba(255, 0, 0, 0.6);
      font-weight: 900;
    }

    .brand-header p {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 400;
    }

    /* Form & Input */
    .input-wrapper {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .input-label-row label {
      font-size: 11.5px;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .paste-btn {
      background: rgba(255, 0, 0, 0.12);
      border: 1px solid rgba(255, 0, 0, 0.3);
      color: #ff4d4d;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .paste-btn:hover {
      background: rgba(255, 0, 0, 0.25);
      color: #ffffff;
    }

    .input-relative {
      position: relative;
    }

    .glow-input {
      width: 100%;
      padding: 14px 40px 14px 14px;
      background: rgba(10, 4, 6, 0.85);
      border: 1.5px solid #37171e;
      border-radius: var(--radius-md);
      color: #ffffff !important;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14.5px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 1.5px;
      outline: none;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3) inset;
    }

    .glow-input::placeholder {
      color: rgba(255, 255, 255, 0.45);
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .glow-input:focus {
      border-color: #ff0000;
      background: rgba(18, 7, 10, 0.95);
      box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.2),
                  0 4px 10px rgba(0, 0, 0, 0.4) inset;
      color: #ffffff !important;
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #cbd5e1;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .clear-btn:hover {
      background: rgba(255, 0, 0, 0.5);
      color: #ffffff;
    }

    /* Error / Success Banner */
    #msg {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .glow-error {
      background: rgba(255, 0, 0, 0.15);
      color: #ff0000 !important;
      border: 1px solid #ff0000 !important;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
    }

    .glow-success {
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    /* Pure Solid Red Action Button */
    .btn-action {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: var(--radius-md);
      background: #ff0000 !important;
      color: #ffffff !important;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
    }

    .btn-action:hover:not(:disabled),
    .btn-action:active:not(:disabled) {
      background: #cc0000 !important;
    }

    .btn-action:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Success Screen - Matching Cyberpunk UI Theme */
    .result-card {
      text-align: center;
      padding: 16px 0 10px;
      animation: zoomIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .success-icon-badge {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      background: rgba(18, 7, 10, 0.9);
      border: 2px solid #ff0000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #22c55e;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.45);
    }

    .check-icon {
      width: 38px;
      height: 38px;
      filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.7));
    }

    .result-card h3 {
      font-size: 23px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .developer-subtext {
      font-size: 13.5px;
      color: #fca5a5;
      margin-bottom: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Footer */
    .portal-footer {
      text-align: center;
      margin-top: 24px;
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      .glass-card {
        padding: 24px 18px;
        border-radius: 18px;
      }
      .brand-header h1 {
        font-size: 21px;
      }
      .logo-container {
        width: 88px;
        height: 88px;
      }
      .glow-input {
        font-size: 13.5px;
        padding: 12.5px 36px 12.5px 12.5px;
      }
      .glow-input::placeholder {
        font-size: 12px;
      }
      .btn-action {
        height: 44px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Red Ambient Glows -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="portal-wrapper">

    <!-- Main Card -->
    <div class="glass-card">
      
      <!-- Brand Logo & Title -->
      <div class="brand-header">
        <div class="logo-container">
          <img 
            src="/logo.png" 
            alt="Prime Aura Logo" 
            class="logo-img"
            onerror="this.src='logo.png';">
        </div>
        <h1><span class="text-red">PRIME</span> AURA</h1>
        <p>Activate your license key</p>
      </div>

      <!-- Activation Form -->
      <div id="activateForm">
        <div class="input-wrapper">
          <div class="input-label-row">
            <label for="keyInput">License Key</label>
            <button class="paste-btn" onclick="pasteKey()" type="button">📋 Paste</button>
          </div>
          <div class="input-relative">
            <input 
              type="text" 
              id="keyInput" 
              placeholder="ENTER YOUR KEY HERE!" 
              autocomplete="off" 
              spellcheck="false"
              class="glow-input"
              oninput="handleInput(this)">
            <button class="clear-btn" id="clearBtn" onclick="clearKey()" type="button">✕</button>
          </div>
        </div>

        <div id="msg"></div>

        <button class="btn-action" id="activateBtn" onclick="activateKey()" type="button">
          LOGIN
        </button>
      </div>

      <!-- Result Screen (Matching UI Theme) -->
      <div id="resultBox" style="display: none;">
        <div class="result-card">
          <div class="success-icon-badge">
            <svg class="check-icon" viewBox="0 0 24 24">
              <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
          <h3>ACTIVATED</h3>
          <p id="successMsg" class="developer-subtext">Developer: Golu Rajput</p>
        </div>
      </div>

      <!-- Footer: System Online Status Badge -->
      <div class="portal-footer">
        <div class="status-badge">
          <div class="pulse-dot"></div>
          <span>SYSTEM ONLINE</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    const keyInput = document.getElementById('keyInput');
    const clearBtn = document.getElementById('clearBtn');

    function handleInput(input) {
      input.value = input.value.toUpperCase();
      clearBtn.style.display = input.value.trim() ? 'flex' : 'none';
    }

    function clearKey() {
      keyInput.value = '';
      clearBtn.style.display = 'none';
      keyInput.focus();
    }

    async function pasteKey() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          keyInput.value = text.trim().toUpperCase();
          clearBtn.style.display = 'flex';
          keyInput.focus();
        }
      } catch (err) {
        console.log('Clipboard unavailable');
      }
    }

    async function activateKey() {
      const key = keyInput.value.trim().toUpperCase();
      const msg = document.getElementById('msg');
      const btn = document.getElementById('activateBtn');
      const form = document.getElementById('activateForm');
      const result = document.getElementById('resultBox');

      if (!key) {
        showMsg(msg, 'Enter your license key', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'LOGGING IN...';

      try {
        const r = await fetch('/api/user_activate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: key })
        });

        const d = await r.json();

        if (d.status === 'ok') {
          form.style.display = 'none';
          result.style.display = 'block';
        } else {
          showMsg(msg, d.message || 'Failed', 'error');
          btn.disabled = false;
          btn.textContent = 'LOGIN';
        }
      } catch (err) {
        showMsg(msg, 'Connection failed', 'error');
        btn.disabled = false;
        btn.textContent = 'LOGIN';
      }
    }

    function resetForm() {
      document.getElementById('activateForm').style.display = 'block';
      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('msg').style.display = 'none';
      const btn = document.getElementById('activateBtn');
      btn.disabled = false;
      btn.textContent = 'LOGIN';
      clearKey();
    }

    function showMsg(el, text, type) {
      el.className = type === 'error' ? 'glow-error' : 'glow-success';
      el.style.display = 'flex';
      el.innerHTML = (type === 'error' ? '⚠️ ' : '✓ ') + text;
    }

    keyInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        activateKey();
      }
    });
  </script>
</body>
</html>
